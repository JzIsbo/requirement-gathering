<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin — Requirement Gathering</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8faff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.10);
      border: 1px solid #e5e7eb;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .description {
      color: #667085;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b42318;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">R</div>

      <h1>Admin Dashboard</h1>

      <div class="description">
        Silakan masuk untuk melihat dan mengelola
        requirement dari client.
      </div>

      <form id="loginForm">

        <label for="email">
          Email Admin
        </label>

        <input
          id="email"
          type="email"
          placeholder="admin@email.com"
          autocomplete="username"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">
          Masuk ke Dashboard
        </button>

        <div id="errorMessage" class="error"></div>

      </form>

      <a class="back" href="../index.html">
        ← Kembali ke Form Client
      </a>

    </div>

  </div>


<script>

  /*
   * ==============================
   * SUPABASE CONFIGURATION
   * ==============================
   */

  const SUPABASE_URL =
    "https://jpfdvlmozjxkxjbbywna.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TGzOotbx7mFQBje2Bgf2Yw_oLODlvne";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   * ==============================
   * CEK SESSION
   * ==============================
   */

  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

      window.location.href =
        "dashboard.html";

    }

  }


  checkSession();


  /*
   * ==============================
   * LOGIN
   * ==============================
   */

  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const button =
        document.getElementById("loginButton");

      const errorBox =
        document.getElementById("errorMessage");


      errorBox.style.display = "none";

      button.disabled = true;

      button.textContent = "Memeriksa...";


      try {

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


        if (error) {

          throw error;

        }


        if (!data.session) {

          throw new Error(
            "Login gagal. Session tidak ditemukan."
          );

        }


        /*
         * LOGIN BERHASIL
         */

        window.location.href =
          "dashboard.html";


      } catch (error) {

        console.error(error);


        errorBox.textContent =
          "Login gagal: " + error.message;

        errorBox.style.display = "block";


        button.disabled = false;

        button.textContent =
          "Masuk ke Dashboard";

      }

    });

</script>

</body>
</html>
