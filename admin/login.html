<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin — Requirement Gathering</title>

  <!-- Supabase JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer>
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8faff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.10);
      border: 1px solid #e5e7eb;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .description {
      color: #667085;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b42318;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #ecfdf3;
      border: 1px solid #abefc6;
      color: #067647;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">R</div>

      <h1>Admin Dashboard</h1>

      <div class="description">
        Silakan masuk untuk melihat dan mengelola
        requirement dari client.
      </div>

      <form id="loginForm">

        <label for="email">
          Email Admin
        </label>

        <input
          id="email"
          type="email"
          placeholder="admin@email.com"
          autocomplete="username"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

        <button
          id="loginButton"
          type="submit"
        >
          Masuk ke Dashboard
        </button>

        <div
          id="loadingMessage"
          class="loading">
          Menghubungkan ke server...
        </div>

        <div
          id="errorMessage"
          class="error">
        </div>

        <div
          id="successMessage"
          class="success">
        </div>

      </form>

      <a
        class="back"
        href="../index.html">
        ← Kembali ke Form Client
      </a>

    </div>

  </div>


<script>
/* =====================================================
   TUNGGU SAMPAI SUPABASE JS SELESAI DIMUAT
===================================================== */

window.addEventListener("load", function () {

  initializeLogin();

});


/* =====================================================
   INISIALISASI LOGIN
===================================================== */

async function initializeLogin() {

  const form =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");

  const loadingMessage =
    document.getElementById("loadingMessage");


  /* -----------------------------------------------
     CEK SUPABASE LIBRARY
  ------------------------------------------------ */

  if (
    typeof window.supabase === "undefined"
  ) {

    showError(
      "Supabase gagal dimuat. Periksa koneksi internet lalu refresh halaman."
    );

    loginButton.disabled = true;

    return;
  }


  /* =================================================
     KONFIGURASI SUPABASE
  ================================================= */

  const SUPABASE_URL =
    "https://jpfdvlmozjxkxjbbywna.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TGzOotbx7mFQBje2Bgf2Yw_oLODlvne";


  let supabaseClient;


  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

  } catch (error) {

    console.error(
      "Supabase initialization error:",
      error
    );

    showError(
      "Gagal menghubungkan ke Supabase."
    );

    loginButton.disabled = true;

    return;
  }


  /* =================================================
     CEK SESSION YANG SUDAH ADA
  ================================================= */

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

    }


    if (
      data &&
      data.session
    ) {

      window.location.href =
        "dashboard.html";

      return;
    }

  } catch (error) {

    console.error(
      "Session check error:",
      error
    );

  }


  /* =================================================
     FORM LOGIN
  ================================================= */

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      hideMessages();


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      /* -----------------------------------------------
         VALIDASI
      ------------------------------------------------ */

      if (!email) {

        showError(
          "Email wajib diisi."
        );

        return;
      }


      if (!password) {

        showError(
          "Password wajib diisi."
        );

        return;
      }


      /* -----------------------------------------------
         LOADING
      ------------------------------------------------ */

      loginButton.disabled = true;

      loginButton.textContent =
        "Memeriksa...";

      loadingMessage.style.display =
        "block";


      try {

        /* ============================================
           LOGIN SUPABASE
        ============================================ */

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        /* ============================================
           CEK ERROR
        ============================================ */

        if (error) {

          console.error(
            "Supabase login error:",
            error
          );

          throw error;
        }


        /* ============================================
           CEK SESSION
        ============================================ */

        if (
          !data ||
          !data.session
        ) {

          throw new Error(
            "Login berhasil tetapi session tidak ditemukan."
          );

        }


        /* ============================================
           LOGIN BERHASIL
        ============================================ */

        successMessage.textContent =
          "Login berhasil. Membuka dashboard...";

        successMessage.style.display =
          "block";

        loadingMessage.style.display =
          "none";

        loginButton.textContent =
          "Berhasil";


        /* ============================================
           TUNGGU SEBENTAR LALU REDIRECT
        ============================================ */

        setTimeout(function () {

          window.location.href =
            "dashboard.html";

        }, 500);


      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );


        loadingMessage.style.display =
          "none";


        let message =
          "Login gagal.";


        /* ---------------------------------------------
           PESAN ERROR SUPABASE
        --------------------------------------------- */

        if (error) {

          if (
            error.message
          ) {

            message =
              error.message;

          }

        }


        /* ---------------------------------------------
           ERROR UMUM
        --------------------------------------------- */

        if (
          message
            .toLowerCase()
            .includes("invalid login credentials")
        ) {

          message =
            "Email atau password salah. Pastikan email tersebut sudah terdaftar di Supabase Authentication.";

        }


        if (
          message
            .toLowerCase()
            .includes("email not confirmed")
        ) {

          message =
            "Email belum dikonfirmasi. Silakan konfirmasi email akun Supabase terlebih dahulu.";

        }


        if (
          message
            .toLowerCase()
            .includes("network")
        ) {

          message =
            "Tidak dapat terhubung ke Supabase. Periksa koneksi internet.";

        }


        showError(
          message
        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "Masuk ke Dashboard";

      }

    }
  );


  /* =================================================
     FUNGSI PESAN ERROR
  ================================================= */

  function showError(message) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

    successMessage.style.display =
      "none";

  }


  /* =================================================
     SEMBUNYIKAN PESAN
  ================================================= */

  function hideMessages() {

    errorMessage.style.display =
      "none";

    successMessage.style.display =
      "none";

  }

}
</script>

</body>
</html>
